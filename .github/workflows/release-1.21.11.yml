name: Build and Release 1.21.11

on:
  push:
    tags:
      - '1.21.11'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release'
        required: true
        default: '1.21.11'

jobs:
  build-and-release:
    name: Build and Create Release
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew clean build --stacktrace
    
    - name: List built JAR files
      run: |
        echo "=== Built JAR files in jars/ directory ==="
        ls -lh jars/ || echo "No jars directory found"
        echo "=== Finding all JAR files ==="
        find . -name "*.jar" -not -path "*/test/*" -not -path "*/.gradle/*" | head -20
    
    - name: Prepare release artifacts
      run: |
        mkdir -p release-artifacts
        if [ -d "jars" ]; then
          cp jars/*.jar release-artifacts/ 2>/dev/null || echo "No JAR files in jars directory"
        fi
        # List what we're releasing
        echo "=== Release artifacts ==="
        ls -lh release-artifacts/
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.event.inputs.tag_name || '1.21.11' }}
        release_name: EssentialsX 1.21.11 for Paper 1.21.11
        body: |
          ## EssentialsX 1.21.11 - Paper 1.21.11 Compatible Release
          
          ### 🎉 New Features
          - ✅ Full compatibility with Paper 1.21.11
          - ✅ Fixed "server is full" bug on Paper 1.21.11
          - ✅ Updated PlayerServerFullCheckEvent API handling
          
          ### 🔧 Changes
          - Updated Paper API from 1.21.8 to 1.21.11
          - Fixed `event.allow()` method call to match Paper 1.21.11 API
          - Updated test server version to 1.21.11
          
          ### 📦 Installation
          1. Download the JAR files below
          2. Place them in your server's `plugins/` folder
          3. Restart your Paper 1.21.11 server
          
          ### 🧪 Tested On
          - ✅ Paper 1.21.11
          - ✅ Compatible with all supported Minecraft versions (1.8.8 - 1.21.11)
          
          ### 📚 Documentation
          See the [PAPER_1.21.11_FIX.md](https://github.com/${{ github.repository }}/blob/${{ github.event.inputs.tag_name || '1.21.11' }}/PAPER_1.21.11_FIX.md) for detailed information about the changes.
          
          ---
          
          **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.event.inputs.tag_name || '1.21.11' }}
        draft: false
        prerelease: false
    
    - name: Upload Release Assets
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs').promises;
          const path = require('path');
          
          const releaseId = ${{ steps.create_release.outputs.id }};
          const artifactsDir = 'release-artifacts';
          
          try {
            const files = await fs.readdir(artifactsDir);
            
            for (const file of files) {
              if (file.endsWith('.jar')) {
                const filePath = path.join(artifactsDir, file);
                const fileContent = await fs.readFile(filePath);
                
                console.log(`Uploading ${file}...`);
                
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: releaseId,
                  name: file,
                  data: fileContent
                });
                
                console.log(`✅ Uploaded ${file}`);
              }
            }
            
            console.log('All JAR files uploaded successfully!');
          } catch (error) {
            console.error('Error uploading release assets:', error);
            throw error;
          }
    
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: EssentialsX-1.21.11-jars
        path: release-artifacts/
        retention-days: 90
