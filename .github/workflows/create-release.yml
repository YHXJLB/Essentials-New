name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., 1.21.11, 2.22.0)'
        required: true
      release_name:
        description: 'Release name (e.g., EssentialsX 1.21.11)'
        required: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.ref }}
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
        cache: 'gradle'
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
    
    - name: Make gradlew executable
      run: chmod +x gradlew
    
    - name: Build with Gradle
      run: ./gradlew clean build --stacktrace --no-daemon
    
    - name: Verify build output
      run: |
        echo "=== Checking for JAR files ==="
        if [ -d "jars" ]; then
          echo "✅ jars directory exists"
          ls -lh jars/
        else
          echo "⚠️  jars directory not found, checking build directories..."
          find . -name "*.jar" -not -path "*/test/*" -not -path "*/.gradle/*" -type f
        fi
    
    - name: Prepare release artifacts
      run: |
        mkdir -p release-artifacts
        
        # Copy JARs from jars directory if it exists
        if [ -d "jars" ]; then
          cp jars/*.jar release-artifacts/ 2>/dev/null || true
        fi
        
        # If jars directory doesn't exist, find JARs in build directories
        if [ -z "$(ls -A release-artifacts 2>/dev/null)" ]; then
          echo "Searching for JAR files in build directories..."
          find . -path "*/build/libs/*.jar" -not -name "*-javadoc.jar" -not -name "*-sources.jar" -exec cp {} release-artifacts/ \;
        fi
        
        # List release artifacts
        echo "=== Release artifacts ==="
        ls -lh release-artifacts/
        
        # Count JARs
        jar_count=$(ls -1 release-artifacts/*.jar 2>/dev/null | wc -l)
        if [ "$jar_count" -eq 0 ]; then
          echo "❌ Error: No JAR files found!"
          exit 1
        else
          echo "✅ Found $jar_count JAR file(s)"
        fi
    
    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << 'EOF'
        ## ${{ inputs.release_name }}
        
        ### 📦 Installation
        1. Download the required JAR files from the assets below
        2. Place them in your server's `plugins/` folder
        3. Restart your server
        
        ### 📋 Included Modules
        EOF
        
        # List all JARs in the release
        for jar in release-artifacts/*.jar; do
          if [ -f "$jar" ]; then
            basename "$jar" >> release_notes.md
          fi
        done
        
        cat >> release_notes.md << 'EOF'
        
        ### 🔧 Build Information
        - Built with Java 17
        - Gradle version: $(./gradlew --version | grep "Gradle" | head -1)
        - Build date: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        - Commit: ${{ github.sha }}
        
        ### 📚 Documentation
        For more information, see the [README](https://github.com/${{ github.repository }}/blob/${{ inputs.tag }}/README.md)
        
        ---
        
        **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ inputs.tag }}
        EOF
        
        # Output for use in release
        echo "Generated release notes:"
        cat release_notes.md
    
    - name: Create Git tag
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "${{ inputs.tag }}" -m "${{ inputs.release_name }}"
        git push origin "${{ inputs.tag }}"
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ inputs.tag }}
        name: ${{ inputs.release_name }}
        body_path: release_notes.md
        draft: false
        prerelease: ${{ inputs.prerelease }}
        files: |
          release-artifacts/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Archive build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.tag }}-build-artifacts
        path: release-artifacts/
        retention-days: 90
    
    - name: Summary
      run: |
        echo "## ✅ Release Created Successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tag:** ${{ inputs.tag }}" >> $GITHUB_STEP_SUMMARY
        echo "**Release Name:** ${{ inputs.release_name }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Released Artifacts" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        ls -lh release-artifacts/ >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "🔗 [View Release](https://github.com/${{ github.repository }}/releases/tag/${{ inputs.tag }})" >> $GITHUB_STEP_SUMMARY
